<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Deposit</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f2f2f2;color:#111}

/* HEADER */
.header{
  position:fixed;top:0;left:0;width:100%;height:60px;
  background:#fff;border-bottom:2px solid #000;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;z-index:2000
}
.header-left{display:flex;align-items:center;gap:15px}
.hamburger{font-size:24px;cursor:pointer}
.clock{font-size:14px}

/* SIDEBAR */
.sidebar{
  position:fixed;top:60px;left:-260px;width:250px;
  height:calc(100% - 60px);background:#000;
  transition:.3s;z-index:1000
}
.sidebar.active{left:0}
.sidebar a{
  display:block;padding:15px 20px;color:#fff;
  text-decoration:none;border-bottom:1px solid #222
}
.sidebar a:hover{background:#111}
.logout{
  position:absolute;bottom:0;width:100%;
  background:#fff;color:#000 !important;font-weight:bold
}

/* MAIN */
.main{padding:90px 20px}

/* CARD */
.card{
  background:#fff;border:2px solid #000;border-radius:8px;
  padding:20px;margin-bottom:25px
}

/* CANVAS */
canvas{
  width:100%;height:300px;
}

/* RESPONSIVE */
@media(min-width:768px){
  .sidebar{left:0}
  .main{margin-left:250px}
  .hamburger{display:none}
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <div class="hamburger" id="hamburger" onclick="toggleMenu()">☰</div>
    <strong>Hai, Celsiadmin01</strong>
  </div>
  <div class="clock" id="clock"></div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <a href="#">🏠 Home</a>
  <a href="#">👤 User</a>
  <a href="#">💰 Deposit</a>
  <a href="#">💸 Withdraw</a>
  <a href="#">⚙️ Setting Player</a>
  <a href="login.html" class="logout">🚪 Logout</a>
</div>

<!-- MAIN -->
<div class="main">

<h2>Statistik Deposit</h2>

<div class="card">
  <canvas id="depositChart"></canvas>
</div>

</div>

<script>
/* ===== MENU ===== */
const sidebar=document.getElementById("sidebar");
const hamburger=document.getElementById("hamburger");

function toggleMenu(){
  sidebar.classList.toggle("active");
  hamburger.innerHTML=sidebar.classList.contains("active")?"✖":"☰";
}

/* ===== CLOCK ===== */
setInterval(()=>{
  document.getElementById("clock").innerText=
    new Date().toLocaleTimeString("id-ID");
},1000);

/* ===== DEPOSIT CHART ===== */
const canvas=document.getElementById("depositChart");
const ctx=canvas.getContext("2d");

/* DATA SESUAI REQUEST */
const data=[
  {label:"50K", value:50},
  {label:"100K", value:21},
  {label:"500K", value:18},
  {label:"1 JT", value:5},
  {label:"1.5 JT", value:6}
];

function drawChart(){
  canvas.width=canvas.offsetWidth;
  canvas.height=300;

  const w=canvas.width;
  const h=canvas.height;
  const max=Math.max(...data.map(d=>d.value));
  const barWidth=(w/data.length)-30;

  ctx.clearRect(0,0,w,h);

  data.forEach((d,i)=>{
    const barHeight=(d.value/max)*(h-80);
    const x=i*(barWidth+30)+30;
    const y=h-barHeight-40;

    /* BAR */
    ctx.fillStyle="#000";
    ctx.fillRect(x,y,barWidth,barHeight);

    /* PERCENT */
    ctx.fillStyle="#000";
    ctx.fillText(d.value+"%",x+barWidth/4,y-5);

    /* LABEL */
    ctx.fillText(d.label,x+barWidth/4,h-15);
  });
}

drawChart();
window.addEventListener("resize",drawChart);
</script>

</body>
</html>
